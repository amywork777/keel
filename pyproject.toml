[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keel-cad"
version = "0.1.0"
description = "A CAD language on NVIDIA's usd-brep (SMLib) kernel: 1D paths, 2D sketches, 3D parts, exact USD output."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["usd-brep>=1.0; sys_platform != 'darwin'"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
